<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Vote Status</title>
  <link rel="icon" href="/assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="lake">
  <div class="topbar">
    <a href="/"><img class="mini-logo" src="/assets/logo.png" alt="Starlight home"></a>
    <a class="back" href="/#performances">← All performances</a>
  </div>

  <main class="page">
    <div class="ornate" id="box" aria-live="polite">
      <div class="status-icon wait">✦</div>
      <h1 class="display" style="font-size:1.6rem">Checking payment…</h1>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    sparkles(30);
    const orderId = new URLSearchParams(location.search).get('order');
    const accessKey = new URLSearchParams(location.hash.slice(1)).get('key');
    const box = document.getElementById('box');
    let tries = 0;
    let previous;
    const formatExpiry = new Intl.DateTimeFormat('en-GB', {
      dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Jakarta',
    });

    function showAccount(o, what) {
      box.innerHTML = `
        ${o.test ? '<p class="mock-banner">Xendit Test Mode. Use a simulated payment only.</p>' : ''}
        <p class="eyebrow">Bank transfer</p>
        <h1 class="display" style="font-size:1.6rem">${escapeHtml(o.bank)} Virtual Account</h1>
        <p>Pay for ${what}.</p>
        <div class="total va-details">
          <p class="label">Virtual account number</p>
          <div class="va-copy"><code>${escapeHtml(o.virtualAccount)}</code><button class="btn ghost small" type="button" id="copy-va">Copy</button></div>
          <p class="label">Exact amount</p>
          <div class="amount">${formatIDR(o.amount)}</div>
          <p class="note">Pay by ${formatExpiry.format(new Date(o.expiresAt))} WIB</p>
        </div>
        <p>${o.test ? 'Simulate the exact amount in Xendit Test Mode.' : 'Choose Virtual Account in your banking app, enter this number and pay the exact amount.'}</p>
        <p class="note">Waiting for payment. This page updates automatically.<br>Order ID: ${escapeHtml(o.id)}</p>`;
      const copy = document.getElementById('copy-va');
      copy.onclick = async () => {
        try {
          await navigator.clipboard.writeText(o.virtualAccount);
          copy.textContent = 'Copied';
        } catch {
          copy.textContent = 'Select number to copy';
        }
      };
    }

    function render(o) {
      const what = `${o.votes.toLocaleString('id-ID')} vote${o.votes > 1 ? 's' : ''} for <strong>${escapeHtml(o.performanceName)}</strong>`;
      if (o.status === 'PAID') {
        box.innerHTML = `
          <div class="status-icon ok">★</div>
          <p class="eyebrow">${o.test ? 'Test payment confirmed' : 'Payment confirmed'}</p>
          <h1 class="display" style="font-size:clamp(1.5rem,5vw,2rem)">Your star shines brighter!</h1>
          <div class="divider">✦</div>
          <p>${what} ${o.votes > 1 ? 'have' : 'has'} been counted.</p>
          <p class="note">Total paid: ${formatIDR(o.amount)}<br>Order ID: ${escapeHtml(o.id)}</p>
          <a class="btn" href="/vote?id=${encodeURIComponent(o.performanceId)}">Vote again</a>
          <p class="hint"><a href="/#performances">Back to all performances</a></p>`;
        return true;
      }
      if (o.status === 'EXPIRED') {
        box.innerHTML = `
          <div class="status-icon bad">✕</div>
          <h1 class="display" style="font-size:1.6rem">Payment expired</h1>
          <p>${o.paymentState ? `The virtual account for ${what} expired. If you already transferred, keep this page open for confirmation.` : `This payment for ${what} expired.`}</p>
          <p class="note">Order ID: ${escapeHtml(o.id)}</p>
          <a class="btn" href="/vote?id=${encodeURIComponent(o.performanceId)}">Try again</a>`;
        return !o.paymentState;
      }
      if (o.paymentState === 'FAILED') {
        box.innerHTML = `
          <div class="status-icon bad">✕</div>
          <h1 class="display" style="font-size:1.6rem">Payment unavailable</h1>
          <p>We couldn't open this bank payment.</p>
          <a class="btn" href="/vote?id=${encodeURIComponent(o.performanceId)}">Try again</a>`;
        return true;
      }
      if (o.virtualAccount) {
        showAccount(o, what);
        return false;
      }
      if (['CREATE_UNKNOWN', 'REVIEW'].includes(o.paymentState)) {
        box.innerHTML = `
          <h1 class="display" style="font-size:1.6rem">Payment needs review</h1>
          <p>Please contact the Starlight organizers with your order ID before making another payment.</p>
          <p class="note">Order ID: ${escapeHtml(o.id)}</p>`;
        return false;
      }
      box.innerHTML = `
        <div class="status-icon wait">✦</div>
        <p class="eyebrow">Waiting for confirmation</p>
        <h1 class="display" style="font-size:1.6rem">${o.paymentState ? 'Checking bank payment' : 'Almost there…'}</h1>
        <p>We're waiting for Xendit to update the payment for ${what}. This page updates automatically.</p>
        ${o.invoiceUrl ? `<p class="hint">Haven't paid yet? <a href="${escapeHtml(o.invoiceUrl)}">Open the payment page</a></p>` : ''}
        <p class="note">Order ID: ${escapeHtml(o.id)}</p>`;
      return false;
    }

    async function poll() {
      if (!orderId) { location.href = '/'; return; }
      try {
        const o = await api('/api/orders/' + encodeURIComponent(orderId), {
          headers: accessKey ? { 'x-order-access': accessKey } : {},
        });
        const current = JSON.stringify(o);
        if (current !== previous) {
          previous = current;
          if (render(o)) return;
        }
      } catch (err) {
        if (err.message === 'Order not found') {
          box.innerHTML = '<div class="status-icon bad">✕</div><h1 class="display" style="font-size:1.6rem">Order not found</h1><p><a href="/">Back to voting</a></p>';
          return;
        }
      }
      tries++;
      setTimeout(poll, tries < 20 ? 3000 : 10000);
    }
    poll();
  </script>
</body>
</html>
